# Self-hosted Flatpak manifest for qt-m4b-player.
#
# Build a bundle with scripts/build-flatpak.sh (requires flatpak-builder), then
# attach the resulting .flatpak to a GitHub release. Nothing here is submitted
# to Flathub; the app id is only used for the sandbox and desktop integration.
app-id: io.github.amb.QtM4bPlayer
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: qt-m4b-player

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # The player opens arbitrary local paths and remembers them across launches.
  # Add e.g. --filesystem=/mnt/nas with `flatpak override` for other mounts.
  - --filesystem=home

# The runtime FFmpeg already provides the AAC decoder, the mov/mp4 demuxer and
# the mov_text decoder this app needs. No ffmpeg-full extension is declared: it
# has no Flathub branch newer than 24.08 and is not required here.

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # libmpv is not in the KDE runtime, so mpv and its subtitle/GPU helper
  # libraries are built here. libass and libplacebo bind their own optional
  # dependencies from the SDK (fontconfig, harfbuzz, freetype, vulkan, shaderc).
  # libplacebo's shader generator runs at build time and imports jinja2, which
  # the SDK does not ship (it does ship MarkupSafe). Install the pure-Python
  # wheel into /app/lib/python3.13/site-packages, already on the SDK sys.path.
  - name: python3-jinja2
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-index jinja2-3.1.6-py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/62/a1/3d680cbfd5f4b8f15abc1d571870c5fc3e594bb582bc3b64ea099db13e56/jinja2-3.1.6-py3-none-any.whl
        sha256: 85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67

  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --enable-harfbuzz
      - --enable-fontconfig
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.gz
        sha256: caab4b993dd7be6187c55623b789ed75dddefea6e65938af134637c732fe094a

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=enabled
      - -Dshaderc=enabled
      - -Dopengl=disabled
      - -Dd3d11=disabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/haasn/libplacebo/archive/refs/tags/v7.360.1.tar.gz
        sha256: d05fdf90bea2f629eaa2d115e909fd356388ac639e54f77b87a018a6d76224bd

  # Audio-only libmpv: video outputs, disc/stream inputs and script engines are
  # disabled to keep the bundle small. PulseAudio is the Flatpak audio socket.
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dtests=false
      - -Dfuzzers=false
      - -Dzlib=enabled
      - -Diconv=enabled
      - -Dpulse=enabled
      - -Dpipewire=disabled
      - -Dalsa=disabled
      - -Djack=disabled
      - -Dopenal=disabled
      - -Dsdl2-audio=disabled
      - -Doss-audio=disabled
      - -Dsndio=disabled
      - -Dx11=disabled
      - -Dwayland=disabled
      - -Ddmabuf-wayland=disabled
      - -Ddrm=disabled
      - -Dgbm=disabled
      - -Degl=disabled
      - -Dgl=disabled
      - -Dplain-gl=disabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dspirv-cross=disabled
      - -Dvaapi=disabled
      - -Dvdpau=disabled
      - -Dcuda-hwaccel=disabled
      - -Dcuda-interop=disabled
      - -Dd3d11=disabled
      - -Dsixel=disabled
      - -Dxv=disabled
      - -Dcaca=disabled
      - -Ddvdnav=disabled
      - -Dcdda=disabled
      - -Dlibbluray=disabled
      - -Dlibarchive=disabled
      - -Ddvbin=disabled
      - -Dvapoursynth=disabled
      - -Djavascript=disabled
      - -Dlua=disabled
      - -Duchardet=disabled
      - -Dzimg=disabled
      - -Drubberband=disabled
      - -Dlcms2=disabled
      - -Dcplugins=disabled
      - -Djpeg=disabled
      - -Dlibavdevice=disabled
      - -Dwerror=false
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  - name: qt-m4b-player
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - .cache
          - .git
